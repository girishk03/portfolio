<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322" />
      <stop offset="1" stop-color="#050A12" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g opacity="0.35">
    <circle cx="260" cy="200" r="140" fill="#00D9FF" filter="url(#glow)" opacity="0.25" />
    <circle cx="980" cy="440" r="180" fill="#A855F7" filter="url(#glow)" opacity="0.22" />
  </g>

  <g opacity="0.35">
    <path d="M0 520 C 260 420, 420 680, 720 540 C 920 450, 1040 520, 1200 470 L1200 630 L0 630 Z" fill="#0B1A2F" />
  </g>

  <g transform="translate(92, 150)">
    <rect x="0" y="0" width="1016" height="330" rx="28" fill="#0B1220" opacity="0.78" stroke="rgba(255,255,255,0.10)" />
    <rect x="24" y="24" width="968" height="282" rx="22" fill="rgba(255,255,255,0.03)" />

    <rect x="52" y="68" width="6" height="184" fill="url(#accent)" />

    <text x="84" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="64" font-weight="800" fill="#EAF2FF">
      Girish Challa
    </text>

    <text x="84" y="184" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="30" font-weight="600" fill="#9CB0C9">
      Software Developer • Python • AI/ML • Web Development
    </text>

    <text x="84" y="244" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#6EE7FF" opacity="0.95">
      girishchalla.dev
    </text>

    <g transform="translate(812, 74)">
      <circle cx="96" cy="96" r="92" fill="rgba(0,217,255,0.10)" stroke="rgba(0,217,255,0.35)" />
      <circle cx="96" cy="96" r="64" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.35)" />
      <circle cx="96" cy="96" r="6" fill="url(#accent)" />
    </g>
  </g>
</svg>
